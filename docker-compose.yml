services:
  postgres:
    image: postgres:16-alpine
    container_name: pontoon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pontoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pontoon}
      POSTGRES_DB: ${POSTGRES_DB:-pontoon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pontoon-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pontoon}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pontoon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    networks:
      - pontoon-data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:latest
    container_name: pontoon-traefik
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=pontoon-ingress"
      - "--entrypoints.web.address=:80"
      # TLS stuff — only kicks in for production domains, not .localhost
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik-certificates:/letsencrypt
    networks:
      - pontoon-ingress

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pontoon-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - pontoon-ingress
    profiles: ["tunnel"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: pontoon-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-pontoon}:${POSTGRES_PASSWORD:-pontoon}@postgres:5432/${POSTGRES_DB:-pontoon}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - DEFAULT_DOMAIN=${DEFAULT_DOMAIN:-pontoon.example.com}
      - API_ADDR=:8080
      - MAX_CONTAINER_MEMORY_MB=${MAX_CONTAINER_MEMORY_MB:-256}
      - TOTAL_CONTAINER_MEMORY_MB=${TOTAL_CONTAINER_MEMORY_MB:-2048}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8080:8080"
    volumes:
      # API needs docker access to manage deployed containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pontoon-ingress
      - pontoon-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: pontoon-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-pontoon}:${POSTGRES_PASSWORD:-pontoon}@postgres:5432/${POSTGRES_DB:-pontoon}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - DEFAULT_DOMAIN=${DEFAULT_DOMAIN:-pontoon.example.com}
      - MAX_CONTAINER_MEMORY_MB=${MAX_CONTAINER_MEMORY_MB:-256}
      - TOTAL_CONTAINER_MEMORY_MB=${TOTAL_CONTAINER_MEMORY_MB:-2048}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - pontoon-ingress
      - pontoon-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  pontoon-ingress:
    external: true
  pontoon-data:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  traefik-certificates: