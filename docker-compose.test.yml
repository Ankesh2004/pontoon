services:
  postgres:
    image: postgres:16-alpine
    container_name: pontoon-postgres
    environment:
      POSTGRES_USER: pontoon
      POSTGRES_PASSWORD: pontoon
      POSTGRES_DB: pontoon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontoon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pontoon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
