version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=pontoon
      - POSTGRES_PASSWORD=pontoon
      - POSTGRES_DB=pontoon
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontoon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--providers.docker.network=pontoon_pontoon-ingress"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pontoon-ingress

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=postgres://pontoon:pontoon@postgres:5432/pontoon?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - DEFAULT_DOMAIN=${DEFAULT_DOMAIN:-localhost}
    networks:
      - pontoon-ingress
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      - DATABASE_URL=postgres://pontoon:pontoon@postgres:5432/pontoon?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_DOMAIN=${DEFAULT_DOMAIN:-localhost}
      - MAX_CONTAINER_MEMORY_MB=${MAX_CONTAINER_MEMORY_MB:-128}
      - TOTAL_CONTAINER_MEMORY_MB=${TOTAL_CONTAINER_MEMORY_MB:-700}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - pontoon-ingress
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_started

networks:
  pontoon-ingress:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
